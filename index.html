<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoga with Kate — концепты сайта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f8f9; --ink:#1f3d44; --ink-soft:#5f7d84; --accent:#3d7f92; --line:#dceaed;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Jost',sans-serif; font-weight:300; line-height:1.6; padding:80px 24px;}
  .wrap{max-width:880px; margin:0 auto;}
  h1{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:clamp(30px,5vw,48px); margin-bottom:10px;}
  .sub{color:var(--ink-soft); margin-bottom:56px; font-size:16px;}
  .card{display:flex; align-items:center; justify-content:space-between; gap:20px; padding:24px 28px; border:1px solid var(--line); border-radius:14px; margin-bottom:16px; background:#fff; transition:0.2s;}
  .card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .card a{color:inherit; text-decoration:none; display:flex; align-items:center; justify-content:space-between; width:100%;}
  .name{font-family:'Cormorant Garamond',serif; font-size:22px;}
  .tag{font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft);}
  .arrow{color:var(--accent); font-size:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Yoga with Kate</h1>
  <p class="sub">Концепты сайта для Екатерины Благодацкой — 5 вариантов дизайна</p>

  <div class="card"><a href="concept-1-ros-blue-primary.html"><span><span class="name">1. Ros-вайб в голубом</span><br><span class="tag">Основной вариант</span></span><span class="arrow">→</span></a></div>
  <div class="card"><a href="concept-2-ros-blue-deep.html"><span><span class="name">2. Глубокий сумеречный синий</span><br><span class="tag">Вариация</span></span><span class="arrow">→</span></a></div>
  <div class="card"><a href="concept-3-ros-blue-airy.html"><span><span class="name">3. Воздушный светлый</span><br><span class="tag">Вариация</span></span><span class="arrow">→</span></a></div>
  <div class="card"><a href="concept-4-bold-bw.html"><span><span class="name">4. Дерзкий чёрно-белый</span><br><span class="tag">Запасной вариант</span></span><span class="arrow">→</span></a></div>
  <div class="card"><a href="concept-5-soft-calm.html"><span><span class="name">5. Мягкий кремово-пудровый</span><br><span class="tag">Запасной вариант</span></span><span class="arrow">→</span></a></div>
</div>
</body>
</html>
